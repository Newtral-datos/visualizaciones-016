<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolución de las llamadas diarias al 016</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --verde: #01f3b3; --gris: #a9a8a2; --gris-cl: #d9d8d3; --rejilla: #f0efec;
    --tinta: #1a1a19; --tinta2: #52514e; --fondo: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta);
         font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { font-size: clamp(22px, 4vw, 32px); line-height: 1.15; margin: 0 0 12px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; color: var(--tinta2); margin: 0 0 12px; }
  .leyenda span { display: inline-flex; align-items: center; gap: 7px; }
  .sw-punto { width: 8px; height: 8px; border-radius: 50%; background: var(--gris); opacity: .7; flex: none; }
  .sw-linea { width: 22px; height: 3px; border-radius: 2px; background: var(--verde); flex: none; }
  .sw-n25 { width: 3px; height: 14px; background: var(--tinta); flex: none; }
  .sw-banda { width: 18px; height: 14px; background: #b5b4ad; opacity: .75; flex: none; }
  .sw-covid { width: 18px; height: 14px; background: #f7f6f3; border: 1px dashed var(--tinta2); flex: none; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .nota { margin-top: 14px; font-size: 12.5px; line-height: 1.45; color: var(--tinta2); }
  .pie { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 12px; }
  .pie .fuente { flex: 1; margin: 0; font-size: 14.5px; line-height: 1.45; color: var(--tinta2); }
  .pie .fuente b { color: var(--tinta); }
  /* El png tiene margen en blanco: márgenes negativos (en % del ancho) para alinear la base del logo con la fuente */
  #logo { flex: none; width: 112px; }
  #logo img { display: block; width: 100%; height: auto; margin: -12% -11% calc(-14% + 4px) 0; }
  #tip { position: fixed; pointer-events: none; opacity: 0; background: #fff; color: var(--tinta);
         border: 1px solid var(--gris-cl); box-shadow: 0 4px 14px rgba(0,0,0,.14);
         font-size: 13.5px; line-height: 1.5; padding: 10px 12px; border-radius: 4px; max-width: 260px; z-index: 5; }
  #tip b { display: block; font-size: 14.5px; margin-bottom: 4px; }
  #tip .caja { display: inline-block; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  #tip .caja.v { background: var(--verde); }
  #tip .caja.g { background: var(--gris-cl); }
  #tip .torneo { display: block; margin-top: 6px; color: var(--tinta2); }
  .capa { touch-action: pan-y; }
  @media (max-width: 640px) {
    main { padding: 16px 12px 28px; }
    h1 { font-size: 20px; }
    .leyenda { font-size: 12px; gap: 4px 14px; }
    .nota { font-size: 11.5px; }
    .pie { gap: 12px; }
    .pie .fuente { font-size: 12px; }
    #logo { width: 84px; }
    #tip { font-size: 12.5px; padding: 8px 10px; }
  }
</style>
</head>

const VERDE = "#01f3b3", GRIS = "#a9a8a2", GRIS_CL = "#d9d8d3", TINTA = "#1a1a19", TINTA2 = "#52514e", REJILLA = "#f0efec";
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const num = (x, d = 0) => d3.format(`,.${d}f`)(Math.abs(x)).replace(/,/g, "·").replace(/\./g, ",").replace(/·/g, ".");
const fechaTxt = d => `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`;
const parse = d3.timeParse("%Y-%m-%d");

const serie = D.fecha.map((f, i) => ({ f: parse(f), llamadas: D.llamadas[i], media: D.media28[i] }));
const torneos = D.torneos.map(t => ({ ...t, ini: parse(t.inicio), fin: parse(t.fin) }));
const covid = D.covid.map(parse);
const CAMBIO = new Date(2022, 5, 1);   // desde junio de 2022 el 016 registra también otras violencias

const tip = d3.select("#tip");
function mostrarTip(ev, d) {
  const t = torneos.find(q => d.f >= q.ini && d.f <= q.fin);
  const es25 = d.f.getMonth() === 10 && d.f.getDate() === 25;
  const enCovid = d.f >= covid[0] && d.f <= covid[1];
  tip.html(`<b>${fechaTxt(d.f)}</b>` +
           `<span class="caja g">${num(d.llamadas)} llamadas</span> ese día<br>` +
           (d.media == null ? "" : `<span class="caja v">${num(d.media)} llamadas</span> de media (28 días)`) +
           (t ? `<span class="torneo">Durante el ${t.nombre}</span>` : "") +
           (enCovid ? `<span class="torneo">Durante el confinamiento</span>` : "") + (es25 ? `<span class="torneo">25N, Día contra la violencia de género</span>` : "")).style("opacity", 1);
  const w = tip.node().offsetWidth, h = tip.node().offsetHeight;
  const left = Math.max(8, Math.min(ev.clientX + 16, innerWidth - w - 8));
  const top = ev.clientY - h - 16 < 8 ? ev.clientY + 16 : ev.clientY - h - 16;
  tip.style("left", left + "px").style("top", top + "px");
}

let MOVIL;
function dibujar() {
  MOVIL = innerWidth < 640;
  const W = MOVIL ? 400 : 1000, H = MOVIL ? 380 : 520;
  const M = MOVIL ? { t: 14, r: 8, b: 28, l: 44 } : { t: 14, r: 12, b: 32, l: 62 };
  const F = MOVIL ? { tick: 12, r: 1.3, etq: 10, linea: 1.8 } : { tick: 13, r: 1.8, etq: 11.5, linea: 2.4 };
  const svg = d3.select("#grafico").html("").attr("viewBox", `0 0 ${W} ${H}`);

  const x = d3.scaleTime().domain(d3.extent(serie, d => d.f)).range([M.l, W - M.r]);
  const y = d3.scaleLinear().domain([0, d3.max(serie, d => d.llamadas) * 1.04]).range([H - M.b, M.t]);

  // Rejilla y eje y
  y.ticks(MOVIL ? 6 : 8).forEach(t => {
    svg.append("line").attr("x1", M.l).attr("x2", W - M.r).attr("y1", y(t)).attr("y2", y(t)).attr("stroke", t === 0 ? TINTA2 : REJILLA);
    svg.append("text").attr("x", M.l - 8).attr("y", y(t)).attr("dy", "0.32em").attr("text-anchor", "end")
      .attr("fill", TINTA2).attr("font-size", F.tick).text(num(t));
  });
  // Eje x: un año sí y otro no en escritorio, cada cuatro en móvil
  x.ticks(d3.timeYear.every(MOVIL ? 4 : 2)).forEach(t => svg.append("text").attr("x", x(t)).attr("y", H - M.b + 20)
    .attr("text-anchor", "middle").attr("fill", TINTA2).attr("font-size", F.tick).text(t.getFullYear()));

  // 25N (25 de noviembre, Día contra la violencia de género): una línea negra por año
  const n25 = d3.range(x.domain()[0].getFullYear(), x.domain()[1].getFullYear() + 1).map(a => new Date(a, 10, 25))
    .filter(f => f >= x.domain()[0] && f <= x.domain()[1]);
  svg.append("g").selectAll("line").data(n25).join("line").attr("x1", d => x(d)).attr("x2", d => x(d))
    .attr("y1", M.t).attr("y2", H - M.b).attr("stroke", TINTA).attr("stroke-width", MOVIL ? 1 : 1.3);

  // Puntos (cada día) y línea de la media de 28 días
  svg.append("g").selectAll("circle").data(serie).join("circle")
    .attr("cx", d => x(d.f)).attr("cy", d => y(d.llamadas)).attr("r", F.r).attr("fill", GRIS).attr("fill-opacity", 0.4);
  svg.append("path").datum(serie.filter(d => d.media != null)).attr("fill", "none").attr("stroke", VERDE)
    .attr("stroke-width", F.linea).attr("stroke-linejoin", "round")
    .attr("d", d3.line().x(d => x(d.f)).y(d => y(d.media)));

  // Cursor: línea vertical, punto del día y punto de la media; el día se busca por la posición horizontal
  const cur = svg.append("g").style("display", "none").attr("pointer-events", "none");
  const vl = cur.append("line").attr("y1", M.t).attr("y2", H - M.b).attr("stroke", TINTA).attr("stroke-width", 1);
  const pd = cur.append("circle").attr("r", 4.5).attr("fill", GRIS).attr("stroke", TINTA).attr("stroke-width", 1.5);
  const pm = cur.append("circle").attr("r", 4.5).attr("fill", VERDE).attr("stroke", TINTA).attr("stroke-width", 1.5);
  const bisect = d3.bisector(d => d.f).center;
  function mover(ev) {
    const [mx] = d3.pointer(ev, svg.node());
    const d = serie[bisect(serie, x.invert(Math.max(M.l, Math.min(W - M.r, mx))))];
    cur.style("display", null);
    vl.attr("x1", x(d.f)).attr("x2", x(d.f));
    pd.attr("cx", x(d.f)).attr("cy", y(d.llamadas));
    pm.attr("display", d.media == null ? "none" : null).attr("cx", x(d.f)).attr("cy", d.media == null ? 0 : y(d.media));
    mostrarTip(ev, d);
  }
  const ocultar = () => { cur.style("display", "none"); tip.style("opacity", 0); };
  svg.append("rect").attr("class", "capa").attr("x", M.l).attr("y", M.t).attr("width", W - M.l - M.r).attr("height", H - M.t - M.b)
    .attr("fill", "transparent").style("cursor", "crosshair")
    .on("pointermove", mover).on("pointerdown", mover).on("pointerleave", ev => { if (ev.pointerType !== "touch") ocultar(); });
  document.addEventListener("pointerdown", ev => { if (!svg.node().contains(ev.target)) ocultar(); });
}

dibujar();
addEventListener("resize", () => { if ((innerWidth < 640) !== MOVIL) dibujar(); });
</script>
