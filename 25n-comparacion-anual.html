<style>
  :root {
    --morado: #C9B1F6; --morado-os: #7D6E99; --gris: #a9a8a2; --gris-cl: #d9d8d3; --rejilla: #f0efec;
    --tinta: #1a1a19; --tinta2: #52514e; --fondo: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta);
         font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { font-size: clamp(22px, 4vw, 32px); line-height: 1.15; margin: 0 0 8px; }
  .sub { font-size: 15px; line-height: 1.4; color: var(--tinta2); margin: 0 0 12px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; color: var(--tinta2); margin: 0 0 12px; }
  .leyenda:empty, .nota:empty { display: none; }
  .sub .pt { display: inline-block; vertical-align: middle; margin: 0 2px 2px; }
  .leyenda span { display: inline-flex; align-items: center; gap: 7px; }
  .leyenda i { flex: none; display: inline-block; }
  .sw-punto { width: 8px; height: 8px; border-radius: 50%; background: var(--gris); opacity: .7; }
  .sw-linea { width: 22px; height: 3px; border-radius: 2px; background: var(--morado-os); }
  .sw-n25 { width: 3px; height: 14px; background: var(--tinta); }
  .sw-c { width: 10px; height: 10px; border-radius: 50%; }
  .sw-c.g { width: 9px; height: 9px; }
  .sw-c.m { width: 13px; height: 13px; background: var(--morado); }
  .sw-c.o { width: 9px; height: 9px; background: var(--morado-os); }
  .sw-rombo { width: 9px; height: 9px; background: var(--tinta); transform: rotate(45deg); }
  .sw-barra { width: 14px; height: 14px; background: var(--morado); }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .nota { margin-top: 14px; font-size: 12.5px; line-height: 1.45; color: var(--tinta2); }
  .fuente { margin: 20px 0 0; font-size: 15.5px; line-height: 1.45; color: var(--tinta2); }
  .fuente b { color: var(--tinta); }
  #tip { position: fixed; pointer-events: none; opacity: 0; background: #fff; color: var(--tinta);
         border: 1px solid var(--gris-cl); box-shadow: 0 4px 14px rgba(0,0,0,.14);
         font-size: 13.5px; line-height: 1.5; padding: 10px 12px; border-radius: 4px; max-width: 270px; z-index: 5; }
  #tip b { display: block; font-size: 14.5px; margin-bottom: 4px; }
  #tip .caja { display: inline-block; padding: 1px 6px; border-radius: 3px; font-weight: 600; background: var(--gris-cl); }
  #tip .caja.m { background: var(--morado); }
  #tip .peq { display: block; margin-top: 5px; color: var(--tinta2); }
  .capa { touch-action: pan-y; }
  @media (max-width: 640px) {
    main { padding: 16px 12px 28px; }
    h1 { font-size: 20px; }
    .sub { font-size: 13.5px; }
    .leyenda { font-size: 12px; gap: 4px 14px; }
    .nota { font-size: 11.5px; }
    .fuente { font-size: 13px; margin-top: 16px; }
    #tip { font-size: 12.5px; padding: 8px 10px; }
  }
</style>

    svg.append("line").attr("x1", M.l).attr("x2", W - M.r).attr("y1", y(t)).attr("y2", y(t))
      .attr("stroke", t === 0 ? TINTA2 : REJILLA).attr("stroke-dasharray", t === 0 ? "4 3" : null);
    texto(svg, M.l - 8, y(t), t > 0 ? `+${t}%` : `${t}%`, { anchor: "end", dy: "0.32em", size: F.tick });
  });
  MESES.forEach((m, i) => texto(svg, x(new Date(2001, i, 15)), H - M.b + 20, m, { anchor: "middle", size: F.tick }));

  const n25 = x(new Date(2001, 10, 25));
  svg.append("line").attr("x1", n25).attr("x2", n25).attr("y1", M.t).attr("y2", H - M.b).attr("stroke", TINTA).attr("stroke-width", 1.3);
  svg.append("g").selectAll("circle").data(dias.filter(d => d.pct <= ymax)).join("circle")
    .attr("cx", d => x(d.x)).attr("cy", d => y(d.pct)).attr("r", MOVIL ? 1.1 : 1.5)
    .attr("fill", GRIS).attr("fill-opacity", 0.28);
  const lin = d3.line().x(d => x(d.x)).y(d => y(d.v)).curve(d3.curveLinear);
  svg.append("path").datum(media).attr("fill", "none").attr("stroke", MORADO).attr("stroke-width", MOVIL ? 3 : 4).attr("stroke-linejoin", "round").attr("d", lin);
  svg.append("path").datum(media).attr("fill", "none").attr("stroke", MORADO_OS).attr("stroke-width", MOVIL ? 1 : 1.3).attr("stroke-linejoin", "round").attr("d", lin);
  const p25 = media.find(d => d.md === "11-25");
  texto(svg, n25 - 10, y(90), `25N: ${pct(p25.v)}`, { anchor: "end", peso: 700, fill: MORADO_OS, size: MOVIL ? 19 : 26 });

  const cur = svg.append("g").style("display", "none").attr("pointer-events", "none");
  const vl = cur.append("line").attr("y1", M.t).attr("y2", H - M.b).attr("stroke", TINTA).attr("stroke-width", 1);
  const pts = cur.append("g");
  const pm = cur.append("circle").attr("r", 5).attr("fill", MORADO).attr("stroke", TINTA).attr("stroke-width", 1.5);
  const bis = d3.bisector(d => d.x).center;
  function mover(ev) {
    const [mx] = d3.pointer(ev, svg.node());
    const m = media[bis(media, x.invert(Math.max(M.l, Math.min(W - M.r, mx))))];
    const v = porDia.get(m.md) || [];
    cur.style("display", null);
    vl.attr("x1", x(m.x)).attr("x2", x(m.x));
    pm.attr("cx", x(m.x)).attr("cy", y(Math.min(m.v, ymax)));
    pts.selectAll("circle").data(v).join("circle").attr("cx", x(m.x)).attr("cy", d => y(Math.min(d.pct, ymax)))
      .attr("r", 3.2).attr("fill", MORADO_OS).attr("fill-opacity", 0.75);
    const mx_ = d3.greatest(v, d => d.pct), mn_ = d3.least(v, d => d.pct);
    colocarTip(ev, `<b>${m.x.getDate()} ${MESES[m.x.getMonth()]}${m.md === "11-25" ? " · 25N" : ""}</b>` +
      `<span class="caja m">${pct(m.v)}</span> de media en ${v.length} años` +
      (v.length ? `<span class="peq">Máximo: ${pct(mx_.pct)} (${mx_.anio}, ${num(mx_.llamadas)} llamadas)<br>Mínimo: ${pct(mn_.pct)} (${mn_.anio}, ${num(mn_.llamadas)} llamadas)</span>` : ""));
  }
  capa(svg, M, W, H, mover, () => { cur.style("display", "none"); ocultarTip(); });
}

// ---------------------------------------------------------------- B1
function b1() {
  const { W, H, M, F, svg } = marco();
  const M1 = { ...M, l: MOVIL ? 40 : 52 };
  const filas = D.filas;
  const xmin = d3.min(filas, d => Math.min(d.previa, d.semana, d.posterior, d.anual)), xmax = d3.max(filas, d => Math.max(d.previa, d.semana, d.posterior, d.anual));
  const x = d3.scaleLinear().domain([Math.floor(xmin / 50) * 50 - 10, Math.ceil(xmax / 50) * 50 + 10]).range([M1.l, W - M1.r]);
  const y = d3.scaleBand().domain(filas.map(d => d.anio)).range([M1.t, H - M1.b]).padding(0.25);
  x.ticks(MOVIL ? 4 : 7).forEach(t => {
    svg.append("line").attr("x1", x(t)).attr("x2", x(t)).attr("y1", M1.t).attr("y2", H - M1.b).attr("stroke", REJILLA);
    texto(svg, x(t), H - M1.b + 20, num(t), { anchor: "middle", size: F.tick });
  });
  const fila = svg.append("g").selectAll("g").data(filas).join("g").attr("transform", d => `translate(0,${y(d.anio) + y.bandwidth() / 2})`);
  fila.append("rect").attr("class", "fondo").attr("x", M1.l).attr("width", W - M1.l - M1.r).attr("y", -y.step() / 2).attr("height", y.step()).attr("fill", MORADO).attr("opacity", 0);
  fila.append("line").attr("x1", d => x(Math.min(d.previa, d.semana, d.posterior, d.anual))).attr("x2", d => x(Math.max(d.previa, d.semana, d.posterior, d.anual)))
    .attr("stroke", GRIS_CL).attr("stroke-width", MOVIL ? 2 : 3);
  const r1 = MOVIL ? 3 : 4, r2 = MOVIL ? 5 : 7;
  fila.append("circle").attr("cx", d => x(d.previa)).attr("r", r1).attr("fill", GRIS);
  fila.append("circle").attr("cx", d => x(d.posterior)).attr("r", r1).attr("fill", MORADO_OSC);
  fila.append("path").attr("transform", d => `translate(${x(d.anual)},0)`).attr("d", d3.symbol(d3.symbolDiamond, (MOVIL ? 5 : 7) ** 2 * 2)()).attr("fill", TINTA);
  fila.append("circle").attr("cx", d => x(d.semana)).attr("r", r2).attr("fill", MORADO).attr("stroke", MORADO_OS).attr("stroke-width", 0.8);
  filas.forEach(d => texto(svg, M1.l - 8, y(d.anio) + y.bandwidth() / 2, d.anio, { anchor: "end", dy: "0.32em", size: F.tick }));
  texto(svg, (M1.l + W - M1.r) / 2, H - 2, "Llamadas al día (media)", { anchor: "middle", size: 12 });

  function mover(ev) {
    const [, my] = d3.pointer(ev, svg.node());
    const i = Math.max(0, Math.min(filas.length - 1, Math.floor((my - M1.t) / y.step())));
    const d = filas[i];
    fila.select(".fondo").attr("opacity", (q) => q === d ? 0.18 : 0);
    colocarTip(ev, `<b>${d.anio}</b>` +
      `<span class="caja m">${num(d.semana)}</span> siete días siguientes al 25N (25 nov-1 dic)<br>` +
      `<span class="caja">${num(d.previa)}</span> semana previa (18-24 nov)<br>` +
      `<span class="caja">${num(d.posterior)}</span> semana posterior (2-8 dic)<br>` +
      `<span class="caja">${num(d.anual)}</span> media del año` +
      `<span class="peq">Los siete días siguientes al 25N, ${pct((d.semana / d.previa - 1) * 100)} sobre la semana previa</span>`);
  }
  const salir = () => { fila.select(".fondo").attr("opacity", 0); ocultarTip(); };
  capa(svg, M1, W, H, mover, salir);
}

// ---------------------------------------------------------------- B4
function b4() {
  const { W, H, M, F, svg } = marco();
  const filas = D.filas;
  const x = d3.scaleBand().domain(filas.map(d => d.anio)).range([M.l, W - M.r]).padding(0.2);
  const lo = Math.min(0, d3.min(filas, d => d.extra)), hi = d3.max(filas, d => d.extra);
  const y = d3.scaleLinear().domain([lo * 1.25, hi * 1.1]).nice().range([H - M.b, M.t]);
  y.ticks(MOVIL ? 6 : 8).forEach(t => {
    svg.append("line").attr("x1", M.l).attr("x2", W - M.r).attr("y1", y(t)).attr("y2", y(t)).attr("stroke", t === 0 ? TINTA2 : REJILLA);
    texto(svg, M.l - 8, y(t), num(t) === "0" ? "0" : (t < 0 ? "−" : "") + num(t), { anchor: "end", dy: "0.32em", size: F.tick });
  });
  const barras = svg.append("g").selectAll("rect").data(filas).join("rect")
    .attr("x", d => x(d.anio)).attr("width", x.bandwidth())
    .attr("y", d => y(Math.max(0, d.extra))).attr("height", d => Math.abs(y(d.extra) - y(0))).attr("fill", MORADO);
  filas.forEach(d => {
    texto(svg, x(d.anio) + x.bandwidth() / 2, d.extra >= 0 ? y(d.extra) - 5 : y(d.extra) + 14, `${d.extra < 0 ? "−" : ""}${num(d.extra)}`,
      { anchor: "middle", size: MOVIL ? 9.5 : 11.5, fill: TINTA });
    texto(svg, x(d.anio) + x.bandwidth() / 2, H - M.b + 20, MOVIL ? `'${String(d.anio).slice(2)}` : d.anio, { anchor: "middle", size: MOVIL ? 10.5 : F.tick });
  });
  const bis = d => d;
  function mover(ev) {
    const [mx] = d3.pointer(ev, svg.node());
    const i = Math.max(0, Math.min(filas.length - 1, Math.floor((mx - M.l) / ((W - M.l - M.r) / filas.length))));
    const d = filas[i];
    barras.attr("fill", q => q === d ? MORADO_OS : MORADO);
    colocarTip(ev, `<b>${d.anio}</b>` +
      `<span class="caja m">${d.extra < 0 ? "−" : "+"}${num(d.extra)} llamadas</span> de más<br>` +
      `${num(d.reales)} reales frente a ${num(d.esperadas)} esperadas` +
      `<span class="peq">${pct(d.pct * 100)} sobre lo esperado en una semana normal</span>`);
  }
  capa(svg, M, W, H, mover, () => { barras.attr("fill", MORADO); ocultarTip(); });
}

const dibujar = () => ({ a3, b1, b4 })[D.tipo]();
dibujar();
addEventListener("resize", () => { if ((innerWidth < 640) !== MOVIL) dibujar(); });
</script>
<script>
/* Altura dinámica para iframe: mide el contenido y avisa a la página padre (WordPress) */
(() => {
  if (window.parent === window) return;
  let ultima = 0, tarea = null;
  const medir = () => {
    const b = document.body, cs = getComputedStyle(b);
    return Math.ceil(b.getBoundingClientRect().height + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom));
  };
  const enviar = () => {
    tarea = null;
    const h = medir();
    if (Math.abs(h - ultima) < 2) return;
    ultima = h;
    parent.postMessage({ tipo: "newtral-iframe-altura", altura: h, url: location.href }, "*");
  };
  const programar = () => { if (!tarea) tarea = requestAnimationFrame(enviar); };
  addEventListener("load", programar);
  addEventListener("resize", programar);
  addEventListener("message", e => { if (e.data && e.data.tipo === "newtral-iframe-pedir-altura") { ultima = 0; programar(); } });
  new ResizeObserver(programar).observe(document.body);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(programar);
  programar();
})();
</script>
